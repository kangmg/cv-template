# Research Interest
research_interest: |
  My research focuses on developing novel computational methods for studying complex 
  molecular systems. I am particularly interested in combining quantum mechanical 
  calculations with machine learning approaches to predict chemical reactivity and 
  molecular properties. The goal is to accelerate the discovery of new materials 
  and therapeutic compounds through efficient computational screening.

