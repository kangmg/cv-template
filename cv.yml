# Research Interest
research_interest: |
  My research focuses on developing and applying machine learning methods to accelerate 
  computational chemistry simulations. I am particularly interested in creating interpretable 
  models that can predict molecular properties and reaction mechanisms with quantum chemical 
  accuracy. My work bridges the gap between traditional ab initio methods and data-driven 
  approaches, aiming to enable high-throughput virtual screening for drug discovery and 
  materials design.

