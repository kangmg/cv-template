name: Deploy CV Template to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate JSON and Typst files
        run: |
          mkdir -p data output
          python scripts/yml2json.py cv.yml data/cv-data.json
          python scripts/yml2json.py template.yml data/template.json
          python scripts/yml2json.py gallery.yml data/gallery.json
          python scripts/generate_typst.py

      - name: Compile PDF
        run: |
          chmod +x typst/typst
          ./typst/typst compile --root . output/cv_output.typ output/CV.pdf

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: web
        run: npm install

      - name: Copy data to web public folder
        run: |
          mkdir -p web/public/data
          cp data/*.json web/public/data/
          cp output/CV.pdf web/public/data/ || true
          cp output/cv_output.typ web/public/data/ || true

      - name: Build Vite project
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
